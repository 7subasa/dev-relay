# 役割ごとのレビュアーの候補。1行に1候補、空白区切りの6列。上にある候補ほど優先する。
# `#` で始まる行と空行は無視する。形式が壊れた行は、ファイル名と行番号を付けてエラーにする。
#
# 列: id  backend  model  effort  billing  vendors
#
#   id       [a-z0-9-]+。ファイル内で重複しない。利用者や報告に見せる名前
#   backend  codex / cursor / claude。実行方法
#   model    モデル名、または -（CLI の既定に任せる）
#   effort   値、または -。codex だけが使う。cursor はモデル名に含まれる
#   billing  included / metered。metered は利用量に応じて課金されうる
#   vendors  カンマ区切りの小文字の名前。差分と設計書が送られる先
#
codex   codex   -              high  included  openai
grok    cursor  grok-4.7-high  -     included  cursor,xai
claude  claude  -              -     included  anthropic
